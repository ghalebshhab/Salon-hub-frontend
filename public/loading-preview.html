<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalonHub Loading Preview</title>
    <style>
      :root{--primary:#76546f;--primary-dark:#5e4058;--accent:#d7a86e;--bg:#faf7f4;--card:#fff;--text:#292329;--muted:#746b72;--border:#e8dedf;color-scheme:light;font-family:Inter,Segoe UI,sans-serif}
      :root[data-theme=dark]{--primary:#c58eba;--primary-dark:#d7a8ce;--accent:#e1b978;--bg:#141216;--card:#211d23;--text:#f8f3f6;--muted:#b9afb6;--border:#423942;color-scheme:dark}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);transition:.2s}
      header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 7vw;border-bottom:1px solid var(--border);background:var(--card)}header strong{font-size:1.45rem}header strong span{color:var(--primary)}nav{display:flex;gap:26px;color:var(--muted);font-weight:700}
      main{min-height:calc(100vh - 78px);display:grid;grid-template-columns:1fr 430px;gap:8vw;align-items:center;padding:8vh 9vw}.copy small{color:var(--primary);font-weight:900;letter-spacing:.15em}.copy h1{margin:16px 0;max-width:660px;font-family:Georgia,serif;font-size:clamp(3rem,6vw,6.2rem);line-height:.94}.copy p{max-width:560px;color:var(--muted);font-size:1.1rem;line-height:1.75}.card{padding:34px;border:1px solid var(--border);border-radius:26px;background:var(--card);box-shadow:0 28px 80px rgba(60,35,44,.12)}.card h2{margin:0 0 8px;font:2rem Georgia,serif}.card p{margin:0 0 24px;color:var(--muted)}label{display:grid;gap:8px;margin:17px 0;font-weight:750}input{padding:14px 16px;border:1px solid var(--border);border-radius:12px;color:var(--text);background:var(--card);font:inherit}.submit{width:100%;margin-top:10px;padding:15px;border:0;border-radius:13px;color:#fff;background:var(--primary);font-weight:900;font-size:1rem}
      .preview-controls{position:fixed;z-index:13000;top:18px;right:18px;display:flex;gap:8px;padding:7px;border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:0 12px 35px rgba(35,20,28,.16)}.preview-controls button{min-width:112px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;color:var(--text);background:var(--card);font-weight:800;cursor:pointer}
      .overlay{position:fixed;inset:0;z-index:12000;display:grid;place-items:center;padding:24px;cursor:wait;background:color-mix(in srgb,var(--bg) 38%,transparent);backdrop-filter:blur(3px) saturate(.84);animation:backdropIn .18s ease-out both}.focus{position:relative;display:grid;justify-items:center;gap:18px;min-width:min(310px,calc(100vw - 48px));padding:34px 42px 30px;overflow:hidden;isolation:isolate;text-align:center;border:1px solid color-mix(in srgb,var(--primary) 25%,var(--border));border-radius:28px;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--primary) 16%,transparent),transparent 58%),color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 30px 80px rgba(47,27,35,.2);animation:focusIn .42s cubic-bezier(.22,1,.36,1) both}:root[data-theme=dark] .focus{border-color:color-mix(in srgb,var(--primary) 42%,var(--border));background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 60%),color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 30px 90px rgba(0,0,0,.48)}
      .stage{position:relative;width:220px;height:104px;overflow:hidden;border-radius:22px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--primary) 7%,transparent),transparent),color-mix(in srgb,var(--primary) 8%,transparent)}.speed-tool{--ink:var(--primary-dark);--highlight:var(--accent);position:absolute;z-index:2;top:52%;left:50%;width:130px;height:36px;margin:-18px 0 0 -67px;filter:drop-shadow(0 10px 10px color-mix(in srgb,var(--primary) 24%,transparent));animation:speeder .42s linear infinite}.speed-air{position:absolute;top:-5px;left:57px;width:38px;height:6px;border-radius:3px 12px 2px 0;background:var(--ink)}.speed-air i{position:absolute;width:30px;height:2px;border-radius:99px;background:var(--highlight);animation:airOne .3s linear infinite}.speed-air i:nth-child(2){top:3px;animation-name:airTwo;animation-duration:.46s}.speed-air i:nth-child(3){top:1px;animation-duration:.52s;animation-delay:-.25s}.speed-air i:nth-child(4){top:4px;animation-duration:.85s;animation-delay:-.4s}.speed-base>span{position:absolute;top:-14px;left:17px;width:88px;height:30px;border-radius:13px 18px 18px 13px;background:linear-gradient(135deg,var(--primary),var(--ink))}.speed-base>span:before{content:"";position:absolute;top:22px;left:51px;width:17px;height:30px;border-radius:4px 4px 9px 9px;background:linear-gradient(180deg,var(--ink),var(--primary));transform:rotate(-13deg);transform-origin:top center}.speed-base>span:after{content:"";position:absolute;top:7px;left:-39px;width:42px;height:16px;background:var(--ink);clip-path:polygon(0 28%,100% 0,100% 100%,0 72%)}.speed-face{position:absolute;top:-8px;left:86px;width:19px;height:19px;border:4px solid var(--highlight);border-radius:50%;background:color-mix(in srgb,var(--ink) 72%,transparent)}.speed-face:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--highlight)}.speed-lines{position:absolute;inset:0;opacity:.72}.speed-lines i{position:absolute;left:120%;width:30%;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--primary));animation:speedLine .68s linear infinite}.speed-lines i:nth-child(1){top:20%;animation-delay:-.4s}.speed-lines i:nth-child(2){top:40%;animation-duration:.82s;animation-delay:-.15s}.speed-lines i:nth-child(3){top:64%;animation-duration:.62s}.speed-lines i:nth-child(4){top:82%;animation-duration:.76s;animation-delay:-.3s}.copy-load{display:grid;gap:5px}.copy-load span{color:var(--primary);font-size:.72rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.copy-load strong{max-width:270px;font:700 1.12rem/1.4 Georgia,serif}.dots{display:flex;gap:7px;height:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:dot 1.05s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.14s}.dots i:nth-child(3){animation-delay:.28s}
      @keyframes backdropIn{from{opacity:0}}@keyframes focusIn{from{opacity:0;transform:translateY(12px) scale(.96)}}@keyframes speeder{0%,100%{transform:translate(2px,1px)}20%{transform:translate(-2px,0) rotate(1deg)}40%{transform:translate(1px,-1px) rotate(1deg)}60%{transform:translate(-1px,1px)}80%{transform:translate(-2px,-1px) rotate(-1deg)}}@keyframes airOne{to{left:-82px;opacity:0}}@keyframes airTwo{to{left:-105px;opacity:0}}@keyframes speedLine{from{left:120%}to{left:-55%;opacity:0}}@keyframes dot{0%,100%{opacity:.3}50%{opacity:1;transform:translateY(-4px)}}
      @media(max-width:800px){main{grid-template-columns:1fr;padding:7vh 7vw}.copy{display:none}nav{display:none}.preview-controls{top:auto;bottom:14px;left:14px;right:14px;justify-content:center}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </head>
  <body>
    <header><strong>Salon<span>Hub</span></strong><nav><span>Discover</span><span>Careers</span><span>My bookings</span></nav></header>
    <main><section class="copy"><small>A BETTER WAY TO BOOK</small><h1>Your next salon experience starts here.</h1><p>Discover trusted salons, book with clarity, and grow through one considered beauty community.</p></section><section class="card"><h2>Welcome back</h2><p>Your SalonHub space is waiting.</p><label>Email address<input value="owner@salonhub.demo" /></label><label>Password<input type="password" value="preview-password" /></label><button class="submit">Sign in</button></section></main>
    <div class="overlay" role="status" aria-live="polite"><div class="focus"><div class="stage"><div class="speed-tool"><span class="speed-air"><i></i><i></i><i></i><i></i></span><div class="speed-base"><span></span><div class="speed-face"></div></div></div><div class="speed-lines"><i></i><i></i><i></i><i></i></div></div><div class="copy-load"><span>SalonHub</span><strong id="message">Signing you in…</strong></div><div class="dots"><i></i><i></i><i></i></div></div></div>
    <div class="preview-controls"><button id="action" type="button">Next action</button><button id="theme" type="button">Dark mode</button></div>
    <script>
      const messages=["Signing you in…","Searching SalonHub…","Booking your appointment…","Sending your application…","Updating your salon…"];let index=0;
      document.querySelector("#action").onclick=()=>{index=(index+1)%messages.length;document.querySelector("#message").textContent=messages[index]};
      document.querySelector("#theme").onclick=(event)=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";event.currentTarget.textContent=dark?"Light mode":"Dark mode"};
    </script>
  </body>
</html>
